<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Stoop: discover communities on a map." />
  <title>Stoop</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">Stoop</div>
    <div class="searchbox">
      <input id="search" type="search" placeholder="Search communities" autocomplete="off" aria-label="Search communities" />
      <div id="search-results" class="results" hidden></div>
    </div>
    <button id="btn-filters" class="filters-btn" type="button" aria-label="Filters">
      <span data-icon="filters"></span><span class="filters-label">Filters</span><span id="filters-count" class="filters-count" hidden></span>
    </button>
    <div id="account" class="account"></div>
  </header>

  <nav id="catbar" class="catbar" aria-label="Categories"></nav>

  <main class="stage">
    <aside id="browse" class="browse" data-snap="half" aria-label="Communities in this area">
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <div class="browse-head">
        <div>
          <h2 id="browse-title">Loading communities…</h2>
          <p id="browse-sub" class="muted small"></p>
        </div>
        <button id="btn-global" class="btn small ghost" type="button"><span data-icon="globe" data-size="16"></span>Anywhere</button>
      </div>
      <div id="browse-list" class="browse-grid" role="list"></div>
    </aside>
    <div id="map" aria-label="Map of communities"></div>
    <button id="btn-locate" class="fab" type="button" title="Center map on my location" aria-label="Center map on my location"><span data-icon="locate" data-size="20"></span></button>
    <button id="btn-view" class="view-toggle" type="button" hidden></button>
  </main>

  <aside id="preview" class="preview" hidden></aside>
  <aside id="drawer" class="drawer" aria-label="Community details"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
