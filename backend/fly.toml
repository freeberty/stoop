# Demo deployment: in-memory store, seeded on start. Data resets on every restart.
app = "stoop-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  Persistence__Provider = "InMemory"
  Seed__Enabled = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep the process alive: in-memory data and SignalR chat
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
